<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Airshare - Share Files via Link</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Airshare ✈️</h1>
    <p class="sub">Upload any file and get a shareable link</p>

    <div class="upload-box" id="dropZone">
      <input type="file" id="fileInput" hidden />
      <div id="fileInfo">Click to select or drag file here</div>
      <button id="browseBtn">Browse Files</button>
    </div>

    <button id="uploadBtn" disabled>Create Share Link</button>

    <div id="result" class="hidden">
      <h3>✅ Link Ready!</h3>
      <div class="link-box">
        <input type="text" id="linkInput" readonly />
        <button id="copyBtn">Copy</button>
      </div>
    </div>

    <div id="loading" class="hidden">
      <div class="spinner"></div>
      <p>Uploading...</p>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
